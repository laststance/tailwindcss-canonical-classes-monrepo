name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        uses: ./.github/actions/prepare

      - name: TypeScript Check packages
        run: |
          pnpm --filter @laststance/tailwindcss-canonical-classes-core typecheck
          pnpm --filter @laststance/tailwindcss-canonical-classes-core build
          pnpm --filter @laststance/tailwind-suggest-canonical-classes typecheck
          pnpm --filter prettier-plugin-tailwindcss-canonical-classes typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        uses: ./.github/actions/prepare

      - name: Build packages
        run: |
          pnpm --filter @laststance/tailwindcss-canonical-classes-core build
          pnpm --filter @laststance/tailwind-suggest-canonical-classes build
          pnpm --filter prettier-plugin-tailwindcss-canonical-classes build
